<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ритм — трекер привычек</title>
  <meta name="description" content="Личный трекер привычек Ритм">
  <meta name="theme-color" content="#0b0d12">
  <link rel="icon" href="icons/rhythm.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="app" class="app hidden">
    <header class="nav-header">
      <h1 class="nav-title" id="nav-title">Сегодня</h1>
      <button id="sync-indicator" class="sync-pill" aria-label="Синхронизировать">
        <span class="sync-dot off" id="sync-dot"></span><span id="sync-text">…</span>
      </button>
    </header>

    <nav class="tabbar" id="tabbar">
      <button class="tab active" data-screen="grid">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4.5" width="18" height="16" rx="3.5"/>
          <path d="M3 9.5h18"/>
          <path d="M8 2.5v4M16 2.5v4"/>
        </svg>
        <span>Сетка</span>
      </button>
      <button class="tab" data-screen="stats">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 20v-6"/>
          <path d="M11 20V9"/>
          <path d="M17 20v-10"/>
          <path d="M3 20h18"/>
        </svg>
        <span>Статистика</span>
      </button>
      <button class="tab" data-screen="habits">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 6h16M4 12h16M4 18h16"/>
          <circle cx="9" cy="6" r="1.6" fill="currentColor" stroke="none"/>
          <circle cx="15" cy="12" r="1.6" fill="currentColor" stroke="none"/>
          <circle cx="7" cy="18" r="1.6" fill="currentColor" stroke="none"/>
        </svg>
        <span>Привычки</span>
      </button>
    </nav>

    <main id="screen" class="screen"></main>
  </div>

  <div id="server-setup" class="setup-screen hidden">
    <div class="setup-card">
      <div class="setup-logo">🌱</div>
      <h1 class="setup-title">Ритм</h1>
      <p class="setup-hint">Откройте адрес сервера на ПК. Оба устройства должны быть в одной доверенной домашней сети. Соединение не шифруется — не используйте публичный Wi-Fi.</p>
      <input type="text" id="server-url" placeholder="http://192.168.1.42:8080" inputmode="url"
             autocapitalize="off" autocomplete="off" spellcheck="false">
      <button id="server-connect" class="btn btn-primary">Подключиться</button>
      <div id="server-status" class="setup-status"></div>
    </div>
  </div>

  <script src="vendor/chart.umd.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
